<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novas maquetes — L’Aiguille des Volcans</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ece8e1;color:#2c2522;font:15px Arial,sans-serif}header{position:sticky;top:0;background:#fff;z-index:2;padding:18px 24px;box-shadow:0 2px 8px #0001;display:flex;gap:15px;flex-wrap:wrap;align-items:center}h1{font:700 20px Georgia,serif;margin:0 auto 0 0}label{font-size:13px}select,a{font:inherit}select{padding:8px;border:1px solid #d9d1c6;border-radius:5px;background:white}a{color:#745925}.intro{max-width:1100px;margin:24px auto;padding:0 20px;line-height:1.6}.stage{margin:24px auto 60px;padding:22px;background:#393939;max-width:1500px;overflow:auto;text-align:center}#image{display:block;max-width:100%;height:auto;margin:auto;background:white}#dimensions{font-size:12px;color:#756a5f}#download{border:1px solid #b89753;padding:9px 13px;border-radius:5px;text-decoration:none}</style></head>
<body><header><h1>L’Aiguille des Volcans</h1><label>Página <select id="page"><option value="accueil">Accueil</option><option value="a-propos">À propos</option><option value="prestations">Prestations</option><option value="galerie">Galerie</option><option value="demande-de-devis">Demande de devis</option><option value="contact">Contact</option><option value="dashboard-admin">Dashboard admin</option><option value="brief">Briefing e recursos</option></select></label><label>Versão <select id="version"><option value="04-maquettes-desktop">Maquete desktop</option><option value="05-maquettes-mobile">Maquete mobile</option><option value="02-wireframes-desktop">Wireframe desktop</option><option value="03-wireframes-mobile">Wireframe mobile</option></select></label><a id="download" download>Salvar SVG</a><a href="LEIA-ME.md">Como importar</a></header>
<div class="intro">Refação baseada nos sete prints e no material do cliente. Selecione uma página para conferir a versão desktop, mobile ou wireframe. <span id="dimensions"></span></div>
<main class="stage"><img id="image" alt="Maquete da página selecionada"></main>
<script>const page=document.getElementById('page'),version=document.getElementById('version'),img=document.getElementById('image'),download=document.getElementById('download');function show(){const brief=page.value==='brief';version.disabled=brief;const url=brief?'01-brief/brief-client-et-ressources.svg':version.value+'/'+page.value+'.svg';img.src=url;img.style.width=brief?'1440px':version.value.endsWith('mobile')?'390px':'1440px';img.alt=page.options[page.selectedIndex].text+' — '+(brief?'Briefing':version.options[version.selectedIndex].text);download.href=url;download.download=url.split('/').pop();document.getElementById('dimensions').textContent=brief?'':version.value.endsWith('mobile')?'Largura: 390 px.':'Largura: 1440 px.'}page.onchange=show;version.onchange=show;show();</script></body></html>
